<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<title>הטאבים שלי · מדף הטאבים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-icon="pick"></span>
        <span class="brand-name">מדף הטאבים</span>
      </a>
      <nav class="nav-links" aria-label="ניווט ראשי">
        <a href="index.html" class="nav-link">
          <span class="icon" data-icon="plus"></span>הוספה
        </a>
        <a href="my-tabs.html" class="nav-link active" aria-current="page">
          <span class="icon" data-icon="library"></span>הטאבים שלי
          <span class="nav-count" data-nav-count hidden></span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header page-header-row">
      <div>
        <h1>הטאבים שלי</h1>
        <p id="stats"></p>
      </div>
      <a href="index.html" class="btn btn-primary">
        <span class="icon" data-icon="plus"></span>טאב חדש
      </a>
    </div>

    <div id="toolbar" class="toolbar" hidden>
      <div class="search">
        <span class="icon search-icon" data-icon="search"></span>
        <input id="search-input" type="search" placeholder="חיפוש לפי שם שיר או אמן…" autocomplete="off" aria-label="חיפוש">
        <kbd class="search-hint" title="קיצור מקלדת לחיפוש">/</kbd>
      </div>
      <div class="toolbar-controls">
        <select id="sort-select" class="select" aria-label="מיון">
          <option value="newest">החדשים ביותר</option>
          <option value="oldest">הישנים ביותר</option>
          <option value="song">שם שיר (א-ת)</option>
          <option value="artist">אמן (א-ת)</option>
        </select>
        <div class="segmented" role="group" aria-label="תצוגה">
          <button type="button" data-view="list">רשימה</button>
          <button type="button" data-view="artist">לפי אמן</button>
        </div>
      </div>
    </div>

    <div id="filter-bar" class="filter-bar" hidden></div>
    <div id="results"></div>
  </main>

  <script src="common.js"></script>
  <script src="library.js"></script>
</body>
</html>
