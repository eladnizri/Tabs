<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="צפייה בעמוד מספר השירים שלך">
<title>צפייה בשיר · מדף הטאבים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="manifest" href="/Tabs/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .viewer-container { max-width: 900px; }
  .viewer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .page-nav { display: flex; align-items: center; gap: 0.5rem; }
  #page-canvas-wrap { background: var(--border); border-radius: 12px; overflow: auto; text-align: center; padding: 1rem; }
  #page-canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .viewer-empty { text-align: center; padding: 3rem 1rem; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-icon="pick"></span>
        <span class="brand-name">מדף הטאבים</span>
      </a>
      <nav class="nav-links" aria-label="ניווט ראשי">
        <a href="index.html" class="nav-link">
          <span class="icon" data-icon="plus"></span>הוספה
        </a>
        <a href="songbook.html" class="nav-link">
          <span class="icon" data-icon="music"></span>ספר שירים
        </a>
        <a href="my-tabs.html" class="nav-link">
          <span class="icon" data-icon="library"></span>הטאבים שלי
          <span class="nav-count" data-nav-count hidden></span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container viewer-container">
    <div id="viewer-body">
      <p>טוען...</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="common.js"></script>
  <script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const pageNum = parseInt(params.get('page'), 10);
const body = document.getElementById('viewer-body');

function noSongbook() {
  body.replaceChildren(
    h(
      'div',
      { class: 'empty-state viewer-empty' },
      h('div', { class: 'empty-icon' }, icon('music')),
      h('h2', {}, 'ספר השירים שלך לא נטען עדיין'),
      h('p', {}, 'כדי לצפות בעמוד, טען קודם את קובץ ה-PDF האישי שלך. זה קורה רק פעם אחת בכל מכשיר, והקובץ נשאר אצלך בלבד.'),
      h('a', { class: 'btn btn-primary', href: 'songbook.html' }, icon('plus'), 'טעינת ספר השירים')
    )
  );
}

function badPage() {
  body.replaceChildren(
    h(
      'div',
      { class: 'empty-state viewer-empty' },
      h('div', { class: 'empty-icon' }, icon('alert')),
      h('h2', {}, 'מספר עמוד לא תקין'),
      h('a', { class: 'btn btn-ghost', href: 'my-tabs.html' }, 'חזרה לספרייה')
    )
  );
}

async function render() {
  if (!pageNum || pageNum < 1) return badPage();

  let stored;
  try {
    stored = await loadPdfFile();
  } catch {
    stored = null;
  }
  if (!stored || !stored.blob) return noSongbook();

  body.replaceChildren(
    h(
      'div',
      { class: 'viewer-toolbar' },
      h('div', { class: 'page-nav' },
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', id: 'prev-btn' }, '← עמוד קודם'),
        h('span', {}, `עמוד ${pageNum}`),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', id: 'next-btn' }, 'עמוד הבא →')
      ),
      h('a', { class: 'btn btn-ghost btn-sm', href: 'my-tabs.html' }, 'חזרה לספרייה')
    ),
    h('div', { id: 'page-canvas-wrap' }, h('canvas', { id: 'page-canvas' }))
  );

  document.getElementById('prev-btn').addEventListener('click', () => {
    if (pageNum > 1) location.href = `view.html?page=${pageNum - 1}`;
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    location.href = `view.html?page=${pageNum + 1}`;
  });

  const arrayBuffer = await stored.blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  if (pageNum > pdf.numPages) return badPage();

  const page = await pdf.getPage(pageNum);
  const canvas = document.getElementById('page-canvas');
  const ctx = canvas.getContext('2d');
  const scale = Math.min(2, (window.devicePixelRatio || 1) * 1.5);
  const viewport = page.getViewport({ scale });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = viewport.width / scale + 'px';
  await page.render({ canvasContext: ctx, viewport }).promise;
}

render().catch((err) => {
  body.replaceChildren(h('p', { class: 'form-error' }, 'שגיאה בטעינת העמוד: ' + err.message));
});
  </script>
</body>
</html>
