<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="ייצוא קישורים לאפליקציה">
<title>ייצוא קישורים · מדף הטאבים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .import-container { max-width: 800px; }
  textarea { width: 100%; min-height: 300px; font-family: monospace; }
  .import-stats { margin-top: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: 8px; }
  .progress-bar { width: 100%; height: 4px; background: var(--bg-tertiary); border-radius: 2px; margin: 1rem 0; overflow: hidden; }
  .progress-fill { height: 100%; background: #b85f28; width: 0%; transition: width 0.3s; }
  .status-item { display: flex; align-items: center; gap: 0.5rem; font-size: 14px; margin: 0.5rem 0; }
  .status-icon { width: 20px; text-align: center; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-icon="pick"></span>
        <span class="brand-name">מדף הטאבים</span>
      </a>
      <nav class="nav-links" aria-label="ניווט ראשי">
        <a href="index.html" class="nav-link">
          <span class="icon" data-icon="plus"></span>הוספה
        </a>
        <a href="my-tabs.html" class="nav-link">
          <span class="icon" data-icon="library"></span>הטאבים שלי
          <span class="nav-count" data-nav-count hidden></span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container import-container">
    <div class="page-header">
      <h1>ייצוא קישורים בעלויות</h1>
      <p>הדבק קישורים (אחד בכל שורה) או בחר בעדכון אוטומטי מ-Negina</p>
    </div>

    <form id="import-form" class="card form-card" novalidate>
      <div class="field">
        <label for="urls-input">קישורים</label>
        <textarea id="urls-input" placeholder="https://negina.co.il/chords/...&#10;https://negina.co.il/chords/..." spellcheck="false"></textarea>
      </div>

      <div class="field">
        <label for="source-select">מקור</label>
        <select id="source-select" class="select">
          <option value="manual">הדבק ידנית</option>
          <option value="negina">עדכון מ-Negina (ניסיוני)</option>
        </select>
      </div>

      <div id="status-area" hidden>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="status-list" class="import-stats"></div>
      </div>

      <p id="import-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-lg">
        <span class="icon" data-icon="plus"></span>ייצוא
      </button>
    </form>
  </main>

  <script src="common.js"></script>
  <script>
const form = document.getElementById('import-form');
const urlsInput = document.getElementById('urls-input');
const sourceSelect = document.getElementById('source-select');
const statusArea = document.getElementById('status-area');
const statusList = document.getElementById('status-list');
const progressFill = document.getElementById('progress-fill');
const importError = document.getElementById('import-error');

sourceSelect.addEventListener('change', async () => {
  if (sourceSelect.value === 'negina') {
    importError.hidden = true;
    urlsInput.disabled = true;
    urlsInput.value = 'טוען קישורים מ-Negina...';

    try {
      const urls = await fetchNegina();
      urlsInput.value = urls.join('\n');
      urlsInput.disabled = false;
      sourceSelect.value = 'manual';
    } catch (e) {
      urlsInput.value = '';
      urlsInput.disabled = false;
      sourceSelect.value = 'manual';
      showError('שגיאה בטעינה מ-Negina: ' + e.message);
    }
  }
});

async function fetchNegina() {
  const response = await fetch('https://negina.co.il/chords');
  const html = await response.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  const urls = new Set();
  doc.querySelectorAll('a[href*="/chords/"]').forEach(link => {
    const href = link.getAttribute('href');
    if (href && !href.includes('?')) {
      const url = 'https://negina.co.il' + href;
      urls.add(url);
    }
  });

  return Array.from(urls);
}

function showError(msg) {
  importError.textContent = msg;
  importError.hidden = false;
}

function clearError() {
  importError.hidden = true;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const urls = urlsInput.value
    .split('\n')
    .map(u => u.trim())
    .filter(Boolean);

  if (!urls.length) return showError('הדבק לפחות קישור אחד');

  statusArea.hidden = false;
  statusList.innerHTML = '';
  progressFill.style.width = '0%';

  const tabs = loadTabs();
  let added = 0, duplicates = 0, invalid = 0;

  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    const progress = ((i + 1) / urls.length * 100);
    progressFill.style.width = progress + '%';

    const item = document.createElement('div');
    item.className = 'status-item';

    try {
      const link = canonicalUrl(normalizeUrl(url));
      if (!link) {
        item.innerHTML = '<span class="status-icon">✗</span><span>קישור לא תקין</span>';
        statusList.appendChild(item);
        invalid++;
        continue;
      }

      if (tabs.some(t => canonicalUrl(t.link) === link)) {
        item.innerHTML = '<span class="status-icon">⊙</span><span>כבר קיים</span>';
        statusList.appendChild(item);
        duplicates++;
        continue;
      }

      const detected = autoDetect(url);
      if (detected && detected.song && detected.artist) {
        tabs.unshift({
          id: newId(),
          song: detected.song,
          artist: detected.artist,
          link: url,
          source: sourceLabel(url),
          addedAt: new Date().toISOString()
        });
        item.innerHTML = `<span class="status-icon">✓</span><span>${detected.song} · ${detected.artist}</span>`;
        statusList.appendChild(item);
        added++;
      } else {
        item.innerHTML = '<span class="status-icon">?</span><span>לא זוהה (צריך ידנית)</span>';
        statusList.appendChild(item);
      }
    } catch (err) {
      item.innerHTML = '<span class="status-icon">✗</span><span>שגיאה</span>';
      statusList.appendChild(item);
      invalid++;
    }
  }

  if (added > 0) {
    saveTabs(tabs);
    const summary = document.createElement('div');
    summary.className = 'import-stats';
    summary.innerHTML = `
      <strong>הסיכום:</strong><br>
      ✓ נוספו: ${added}<br>
      ⊙ כבר קיימים: ${duplicates}<br>
      ✗ שגיאות: ${invalid}
    `;
    statusList.appendChild(summary);

    showToast(`הוסף ${added} טאבים בהצלחה`, {
      type: 'success',
      actionLabel: 'לספרייה',
      onAction: () => (location.href = 'my-tabs.html')
    });
  } else {
    showError('לא הוספו טאבים');
  }
});
  </script>
</body>
</html>
